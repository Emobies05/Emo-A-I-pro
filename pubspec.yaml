name: Build Flutter APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Flutter 3.24.x ഉപയോഗിക്കുന്നത് വഴി Dart SDK പ്രശ്നം ഒഴിവാക്കാം
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.24.x' 
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # രണ്ട് കീകളും 'dart-define' വഴി ആപ്പിലേക്ക് പാസ്സ് ചെയ്യുന്നു
      - name: Build APK
        run: |
          flutter build apk --release \
          --dart-define=GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }} \
          --dart-define=CLOUDFLARE_API_KEY=${{ secrets.CLOUDFLARE_API_KEY }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: emo-ai-pro-release
          path: build/app/outputs/flutter-apk/app-release.apk
