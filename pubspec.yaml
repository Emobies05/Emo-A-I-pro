name: Build Flutter APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # FIX: We use '3.22.0' or higher to ensure Dart SDK is >= 3.4.0
      # This resolves the speech_to_text dependency conflict
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.24.x' 
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Optional: Add this if you have generated code (like for your API/Models)
      # - name: Run Build Runner
      #   run: dart run build_runner build --delete-conflicting-outputs

      - name: Build APK
        run: flutter build apk --release

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: emo-ai-pro-release
          path: build/app/outputs/flutter-apk/app-release.apk
