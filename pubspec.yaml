version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.1
  # Harmonized Versions for Heavily Heaven
  audioplayers: ^6.4.0
