name: Build Flutter APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Flutter 3.24.x ഉപയോഗിക്കുന്നത് വഴി എല്ലാ ഡിപെൻഡൻസി പ്രശ്നങ്ങളും മാറും
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.24.x' 
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # ലിസ്റ്റിലുള്ള എല്ലാ പുതിയ കീകളും ഇവിടെ ആഡ് ചെയ്തിട്ടുണ്ട്
      - name: Build APK
        run: |
          flutter build apk --release \
          --dart-define=GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }} \
          --dart-define=CLOUDE_API_KEY=${{ secrets.CLOUDE_API_KEY }} \
          --dart-define=ASSISTLOOP_API_KEY=${{ secrets.ASSISTLOOP_API_KEY }} \
          --dart-define=CLOUDFLARE_API_TOKEN=${{ secrets.CLOUDFLARE_API_TOKEN }} \
          --dart-define=CLOUDFLARE_ACCOUNT_ID=${{ secrets.CLOUDFLARE_ACCOUNT_ID }} \
          --dart-define=OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }} \
          --dart-define=VERCEL_AI_API_KEY=${{ secrets.VERCEL_AI_API_KEY }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: emo-ai-pro-release
          path: build/app/outputs/flutter-apk/app-release.apk
