name: Backend CI

on:
  push:
    branches: [ "main" ]
    paths:
      - "emo-ai-pro/**"
  pull_request:
    branches: [ "main" ]

jobs:
  backend:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: "npm"
        cache-dependency-path: emo-ai-pro/package-lock.json

    - name: Install dependencies
      working-directory: emo-ai-pro
      run: npm install

    - name: Lint
      working-directory: emo-ai-pro
      run: npm run lint --if-present

    - name: Test
      working-directory: emo-ai-pro
      run: npm test --if-present

    - name: Build
      working-directory: emo-ai-pro
      run: npm run build --if-present
    - name: Test
      working-directory: emo-ai-pro
      run: npm test --if-present

    - name: Build
      working-directory: emo-ai-pro
      run: npm run build --if-present
